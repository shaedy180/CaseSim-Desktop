[package]
name = "casesim-desktop"
version = "22.7.52"
description = "CaseSim Windows desktop preview"
edition = "2021"
rust-version = "1.99"

[build-dependencies]
tauri-build = "=2.7.3"

[dependencies]
tauri = "=2.12.4"
tauri-plugin-window-state = "=2.5.0"
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-updater = "=2.14.0"
tauri-plugin-dialog = "=2.8.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "=5.4.4"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Optimize the small native shell, not the hosted game or its GPU configuration.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[dev-dependencies]
tauri = { version = "=2.12.4", features = ["test"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
