<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>CaseSim</title>
  <link rel="stylesheet" href="shell.css">
  <script src="shell.js" defer></script>
</head>
<body>
  <main>
    <div class="brand" aria-label="CaseSim">CASE<span>SIM</span><i aria-hidden="true"></i></div>
    <div class="panel">
      <div class="indicator" aria-hidden="true"></div>
      <h1 id="heading">Connecting to CaseSim</h1>
      <p id="message" role="status" aria-live="polite">Your cases. Your collection. Ready when you are.</p>
      <button id="retry" type="button">Retry connection</button>
    </div>
    <p class="footnote">DESKTOP PREVIEW <span aria-hidden="true">/</span> ONLINE EXPERIENCE<br>DESKTOP CONTROLS <kbd>CTRL+SHIFT+D</kbd></p>
  </main>
</body>
</html>
